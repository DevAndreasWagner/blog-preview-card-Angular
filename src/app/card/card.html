<div class="w-80 flex flex-col justify-center items-start bg-white p-6 gap-6 rounded-2xl ring-1 shadow-[8px_8px_1px] ">
    <img class="w-full rounded-lg" [src]="imgSrc" alt="">
    <span class="flex flex-col items-start gap-4">
        <p class="bg-yellow px-3 py-1 text-xs font-extrabold rounded-sm">{{chapter}}</p>
        <p class=" text-xs font-semibold">{{publishDate}}</p>
        <h1 class="text-lg font-black hover:text-yellow cursor-pointer">{{title}}</h1>
        <p class="text-gray-500 text-sm">{{description}}</p>
    </span>
    <div class="flex flex-row items-center gap-2">
        <img class="w-7 h-7" [src]="profileImgSrc" alt="">
        <p class="text-xs font-extrabold">{{profileImgName}}</p>
    </div>
    
</div>
